<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉐어클래스 - 비개발자를 위한 Claude Code 입문</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:#f8fafc;color:#1a1a1a;line-height:1.6;overflow:hidden;height:100vh}

/* ── Header ── */
.header{background:#191919;color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:100}
.header-logo{font-weight:800;font-size:14px;letter-spacing:-.3px}
.header-sep{width:1px;height:18px;background:rgba(255,255,255,.2)}
.header-title{font-size:13px;opacity:.85;flex:1}
.header-lock{color:rgba(255,255,255,.25);font-size:11px;text-decoration:none}

/* ── App Layout ── */
.app{display:flex;flex-direction:column;height:100vh}
.app-body{display:flex;flex:1;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:220px;background:#fff;border-right:1px solid #e2e8f0;overflow-y:auto;flex-shrink:0;padding:12px 0;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
.sb-section{margin-bottom:4px}
.sb-title{font-size:11px;font-weight:700;color:#94a3b8;padding:10px 16px 4px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.sb-title:hover{color:#64748b}
.sb-title .sb-chevron{font-size:9px;transition:transform .15s}
.sb-title.collapsed .sb-chevron{transform:rotate(-90deg)}
.sb-items{overflow:hidden;transition:max-height .2s ease}
.sb-items.collapsed{max-height:0!important}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;color:#475569;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.sb-item:hover{background:#f1f5f9}
.sb-item.active{background:#eef2ff;color:#4f46e5;font-weight:600;border-left-color:#4f46e5}
.sb-item.completed{color:#16a34a}
.sb-item .sb-label{font-size:11px;font-weight:700;color:#94a3b8;min-width:28px}
.sb-item.active .sb-label{color:#4f46e5}
.sb-item.completed .sb-label{color:#16a34a}
.sb-item .sb-dot{width:6px;height:6px;border-radius:50%;background:#cbd5e1;flex-shrink:0}
.sb-item.active .sb-dot{background:#4f46e5;width:8px;height:8px}
.sb-item.completed .sb-dot{background:#16a34a}
.sb-item .sb-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Content Area ── */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content-header{padding:10px 24px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.content-header h2{font-size:16px;font-weight:700;color:#1e293b}
.content-header .step-counter{font-size:12px;color:#94a3b8;font-weight:600}
.content-body{flex:1;display:grid;grid-template-columns:2fr 3fr;gap:0;overflow:hidden}

/* ── Preview Panel (Left) ── */
.preview-panel{background:#f1f5f9;padding:24px;display:flex;align-items:center;justify-content:center;border-right:1px solid #e2e8f0;overflow-y:auto}

/* ── Text Panel (Right) ── */
.text-panel{padding:24px 32px;overflow-y:auto}
.text-panel::-webkit-scrollbar{width:5px}
.text-panel::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.step-label{font-size:12px;font-weight:700;color:#4f46e5;background:#eef2ff;display:inline-block;padding:3px 12px;border-radius:20px;margin-bottom:12px}
.step-desc{font-size:14px;color:#334155;line-height:1.7;margin-bottom:16px}

/* Code block */
.code-block{position:relative;margin:12px 0;background:#0f172a;border-radius:10px;overflow:hidden}
.code-block-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
.code-block-header span{font-size:11px;color:#64748b;font-family:'Cascadia Code',monospace}
.code-copy{background:rgba(255,255,255,.1);color:#94a3b8;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;transition:.15s}
.code-copy:hover{background:rgba(255,255,255,.2);color:#fff}
.code-copy.copied{background:#10b981;color:#fff;border-color:#10b981}
.code-block pre{margin:0;padding:14px;color:#e2e8f0;font-size:13px;line-height:1.7;font-family:'Cascadia Code','D2Coding','Fira Code',monospace;overflow-x:auto;white-space:pre-wrap}

/* Success/Fail boxes */
.result-box{padding:10px 14px;border-radius:8px;font-size:12.5px;margin:8px 0;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.result-box.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.result-box.fail{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.result-box .result-icon{font-size:14px;flex-shrink:0}

/* Tip box */
.tip-box{padding:10px 14px;border-radius:8px;font-size:12.5px;margin:8px 0;background:#fffbeb;color:#92400e;border:1px solid #fde68a;line-height:1.5}

/* Checkbox + Memo */
.step-tools{margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}
.step-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;cursor:pointer}
.step-check input{width:18px;height:18px;accent-color:#4f46e5;cursor:pointer}
.step-check input:checked+span{color:#16a34a;text-decoration:line-through}
.step-memo{width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;min-height:54px;resize:vertical;font-family:inherit;outline:none;background:#fafbfc}
.step-memo:focus{border-color:#4f46e5;background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.08)}
.step-memo::placeholder{color:#adb5bd}

/* Compact table */
.compact-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0}
.compact-table th{background:#191919;color:#fff;padding:8px 12px;text-align:left;font-weight:600;white-space:nowrap}
.compact-table td{padding:8px 12px;border-bottom:1px solid #e2e8f0}
.compact-table tr:last-child td{border-bottom:none}
.compact-table tr:hover td{background:#f8fafc}

/* ── Bottom Nav ── */
.bottom-nav{padding:10px 24px;background:#fff;border-top:2px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.bottom-nav button{padding:10px 28px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-prev{background:#f1f5f9;color:#475569}
.btn-prev:hover{background:#e2e8f0}
.btn-next{background:#4f46e5;color:#fff;padding:10px 36px;animation:pulse-next 2s infinite}
.btn-next:hover{background:#4338ca}
@keyframes pulse-next{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.4)}50%{box-shadow:0 0 0 8px rgba(79,70,229,0)}}
.bottom-nav button:disabled{opacity:.3;cursor:not-allowed;animation:none}
.nav-center{text-align:center}
.nav-label{font-size:13px;font-weight:600;color:#334155}
.nav-counter{font-size:11px;color:#94a3b8;margin-top:1px}
.nav-hint{font-size:10px;color:#94a3b8;margin-top:2px}

/* ── Terminal Mockup ── */
.term{background:#0f172a;border-radius:10px;padding:16px;width:100%;font-family:'Cascadia Code','D2Coding',monospace;font-size:12px;line-height:1.7;color:#e2e8f0}
.term-bar{display:flex;gap:6px;margin-bottom:10px}
.term-dot{width:10px;height:10px;border-radius:50%}
.term .prompt{color:#22d3ee}
.term .cmd{color:#f8fafc}
.term .output{color:#94a3b8}
.term .success{color:#4ade80}
.term .error{color:#f87171}
.term .comment{color:#475569;font-style:italic}
.term .highlight{color:#fbbf24}

/* ── File Preview Mockup ── */
.file-mock{background:#fff;border:1px solid #e2e8f0;border-radius:10px;width:100%;overflow:hidden}
.file-mock-bar{background:#f1f5f9;padding:8px 12px;font-size:11px;color:#64748b;border-bottom:1px solid #e2e8f0;font-weight:600;display:flex;align-items:center;gap:6px}
.file-mock-body{padding:14px;font-size:12px;line-height:1.7;color:#334155}
.file-mock-body .line{padding:1px 0}
.file-mock-body .line-h1{font-size:14px;font-weight:700;color:#1e293b;margin:4px 0 2px}
.file-mock-body .line-h2{font-size:13px;font-weight:700;color:#4f46e5;margin:4px 0 2px}
.file-mock-body .line-h3{font-size:12px;font-weight:600;color:#0f766e;margin:2px 0}
.file-mock-body .line-dim{color:#94a3b8}
.file-mock-body .line-bold{font-weight:600;color:#1e293b}
.file-mock-body .line-bullet{padding-left:12px}
.file-mock-body .line-num{color:#94a3b8;font-family:'Cascadia Code',monospace;font-size:10px;margin-right:8px;display:inline-block;min-width:18px;text-align:right}

/* ── Dooray Mockup ── */
.dooray-mock{background:#fff;border:1px solid #e2e8f0;border-radius:10px;width:100%;overflow:hidden}
.dooray-mock-bar{background:#4f46e5;color:#fff;padding:10px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.dooray-mock-body{padding:14px;font-size:12px;line-height:1.7}
.dooray-field{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #f1f5f9}
.dooray-field:last-child{border-bottom:none}
.dooray-field .df-label{color:#94a3b8;min-width:60px;font-weight:600;font-size:11px}
.dooray-field .df-value{color:#334155;flex:1}
.dooray-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin:1px 2px}
.dooray-tag.tag-open{background:#dbeafe;color:#1d4ed8}
.dooray-tag.tag-done{background:#dcfce7;color:#16a34a}
.dooray-tag.tag-prog{background:#fef3c7;color:#92400e}

/* ── Dashboard Mockup ── */
.dash-mock{background:#fff;border:1px solid #e2e8f0;border-radius:10px;width:100%;overflow:hidden}
.dash-bar-title{background:#f1f5f9;padding:8px 14px;font-size:11px;font-weight:700;color:#64748b;border-bottom:1px solid #e2e8f0}
.dash-body{padding:14px;display:flex;gap:14px;flex-wrap:wrap}
.dash-chart{flex:1;min-width:120px}
.dash-chart-title{font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:8px;text-transform:uppercase}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px}
.bar-item{flex:1;border-radius:4px 4px 0 0;position:relative;transition:height .3s}
.bar-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:#94a3b8;white-space:nowrap}
.bar-val{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:#475569}
.pie-chart{width:80px;height:80px;border-radius:50%;position:relative;margin:0 auto}
.pie-legend{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.pie-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:#475569}
.pie-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── Email Mockup ── */
.email-mock{background:#fff;border:1px solid #e2e8f0;border-radius:10px;width:100%;overflow:hidden}
.email-mock-bar{background:#f1f5f9;padding:8px 14px;font-size:11px;font-weight:700;color:#64748b;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:6px}
.email-mock-body{padding:14px;font-size:12px;line-height:1.7;color:#334155}
.email-to{display:flex;gap:6px;align-items:center;padding:4px 0;font-size:11px}
.email-to .to-label{color:#94a3b8;font-weight:600}
.email-to .to-val{color:#334155}
.email-sep{border-bottom:1px solid #e2e8f0;margin:6px 0}
.email-amount{font-weight:700;color:#4f46e5}

/* ── Compare Mockup ── */
.compare-mock{width:100%;display:flex;gap:12px}
.compare-card{flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px;text-align:center}
.compare-card.highlight{border-color:#4f46e5;box-shadow:0 0 0 2px rgba(79,70,229,.15)}
.compare-icon{font-size:28px;margin-bottom:6px}
.compare-name{font-size:11px;font-weight:700;color:#334155;margin-bottom:4px}
.compare-desc{font-size:10px;color:#94a3b8;line-height:1.4}

/* ── Permission Mockup ── */
.perm-mock{background:#fff;border:1px solid #e2e8f0;border-radius:10px;width:100%;overflow:hidden;padding:16px}
.perm-popup{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:8px;padding:12px;margin-bottom:8px}
.perm-popup-title{font-size:11px;font-weight:700;color:#475569;margin-bottom:6px}
.perm-popup-item{display:flex;gap:6px;padding:3px 0;font-size:11px}
.perm-popup-item .perm-key{color:#94a3b8;min-width:50px}
.perm-popup-item .perm-val{color:#334155}
.perm-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.perm-badge.mode-ask{background:#fef3c7;color:#92400e}
.perm-badge.mode-auto{background:#dcfce7;color:#16a34a}
.perm-badge.mode-plan{background:#dbeafe;color:#1d4ed8}

/* ── Before/After ── */
.ba-mock{width:100%}
.ba-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0}
.ba-card{border-radius:8px;padding:12px;font-size:11px;line-height:1.6}
.ba-card.before{background:#fef2f2;border:1px solid #fecaca}
.ba-card.after{background:#ecfdf5;border:1px solid #a7f3d0}
.ba-card .ba-label{font-size:10px;font-weight:700;margin-bottom:4px}
.ba-card.before .ba-label{color:#991b1b}
.ba-card.after .ba-label{color:#065f46}

/* ── Tooltip ── */
.tip-trigger{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#e2e8f0;color:#475569;font-size:11px;font-weight:700;cursor:pointer;margin-left:4px;position:relative;vertical-align:middle;user-select:none}
.tip-trigger:hover{background:#cbd5e1}
.tip-bubble{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.6;width:max-content;max-width:320px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.2);font-weight:400;text-align:left;white-space:normal}
.tip-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#1e293b}
.tip-trigger.active .tip-bubble{display:block}

/* ── Floating Buttons ── */
.submit-fab{position:fixed;bottom:88px;right:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;padding:14px 24px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(79,70,229,.4);z-index:100;transition:transform .2s}
.submit-fab:hover{transform:scale(1.05)}
.scroll-top{position:fixed;bottom:148px;right:24px;width:42px;height:42px;border-radius:50%;background:#191919;color:#fff;border:none;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:50}
.scroll-top.show{display:flex}

/* ── Responsive ── */
@media(max-width:900px){
  .sidebar{width:180px}
  .content-body{grid-template-columns:1fr}
  .preview-panel{display:none}
}
@media(max-width:640px){
  .sidebar{display:none}
  .text-panel{padding:16px}
}
@media print{.sidebar,.bottom-nav,.submit-fab,.scroll-top,#chat-btn,#chat-panel{display:none!important}.app-body{display:block}.content-body{display:block}}
</style>
</head>
<body>
<script>
(function(){
  var expire = new Date('2026-12-31T23:59:59+09:00');
  if(new Date() > expire){
    document.documentElement.innerHTML = '<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비공개</title></head>'
      + '<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#7c3aed);font-family:Pretendard,system-ui,sans-serif;">'
      + '<div style="text-align:center;color:#fff;padding:40px;">'
      + '<div style="font-size:64px;margin-bottom:24px;">🦋</div>'
      + '<h1 style="font-size:36px;font-weight:800;margin:0;">현재 공개 기간이 아닙니다</h1>'
      + '<p style="font-size:20px;margin-top:16px;color:#e0e7ff;">다음 교육에서 만나요!</p>'
      + '</div></body>';
    throw 'expired';
  }
})();
</script>

<div class="app">
  <!-- Header -->
  <header class="header">
    <span class="header-logo">AI School</span>
    <span class="header-sep"></span>
    <span class="header-title">비개발자를 위한 Claude Code 입문</span>
    <button onclick="resetAllProgress()" style="background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;" title="체크/메모 전체 초기화">♻️ 초기화</button>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar"></nav>

    <!-- Main Content -->
    <div class="content">
      <div class="content-header">
        <h2 id="contentTitle">0-A &middot; 표지</h2>
        <span class="step-counter" id="stepCounter">1 / 29</span>
      </div>
      <div class="content-body">
        <div class="preview-panel" id="previewPanel"></div>
        <div class="text-panel" id="textPanel"></div>
      </div>
      <div class="bottom-nav">
        <button class="btn-prev" id="btnPrev" onclick="prevStep()">&larr; 이전</button>
        <div class="nav-center">
          <div class="nav-label" id="navLabel">0-A &middot; 표지</div>
          <div class="nav-counter" id="navCounter">1 / 29</div>
          <div class="nav-hint">&#8592; &#8594; 키보드로 이동</div>
        </div>
        <button class="btn-next" id="btnNext" onclick="nextStep()">다음 &rarr;</button>
      </div>
    </div>
  </div>
</div>

<!-- Floating buttons -->
<button class="submit-fab" onclick="generateSubmitPrompt()">&#x1F4EE; 과제 제출</button>
<button class="scroll-top" id="scrollTopBtn" onclick="document.getElementById('textPanel').scrollTop=0">&#8593;</button>

<script>
// ═══════════════════════════════════════════════════════
// STEPS DATA
// ═══════════════════════════════════════════════════════
const STEPS = [
  // ── 0. 안내 ──
  {
    id:'0-A', section:'안내', title:'표지',
    preview() {
      return `<div style="text-align:center;width:100%;">
        <div style="font-size:64px;margin-bottom:20px;">🦋</div>
        <div style="font-size:11px;font-weight:700;color:#4f46e5;background:#eef2ff;display:inline-block;padding:4px 14px;border-radius:20px;margin-bottom:16px;">SHARE CLASS 2026</div>
        <h1 style="font-size:28px;font-weight:800;color:#1e293b;line-height:1.3;margin-bottom:12px;">비개발자를 위한<br>Claude Code<br>업무 자동화 입문</h1>
        <div style="font-size:13px;color:#64748b;line-height:1.8;">
          <div>👩‍🏫 NHN Cloud 파트너지원팀 정유경</div>
        </div>
        <div style="margin-top:20px;padding:16px 20px;background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #bbf7d0;border-radius:12px;text-align:left;">
          <div style="font-size:15px;font-weight:700;color:#166534;margin-bottom:8px;">저는요! 👋</div>
          <p style="font-size:13px;color:#166534;line-height:1.8;margin:0;">"비개발자도 AI를 자유롭게 쓸 수 있게 돕는 일을 합니다."<br>이 강의를 듣는 모든 사람들이 다 저처럼 즐거운 경험을 하길 바랍니다.</p>
        </div>
      </div>`;
    },
    content() {
      return `
        <div class="step-label">환영합니다!</div>

function termMock(lines) {
  let html = '<div class="term"><div class="term-bar"><div class="term-dot" style="background:#ff5f57"></div><div class="term-dot" style="background:#febc2e"></div><div class="term-dot" style="background:#28c840"></div></div>';
  lines.forEach(l => {
    if (l.type === 'prompt') html += '<span class="prompt">' + esc(l.text) + '</span>';
    else if (l.type === 'cmd') html += '<span class="cmd">' + esc(l.text) + '</span><br>';
    else if (l.type === 'output') html += (l.text ? '<span class="output">' + esc(l.text) + '</span>' : '') + '<br>';
    else if (l.type === 'success') html += '<span class="success">' + esc(l.text) + '</span><br>';
    else if (l.type === 'error') html += '<span class="error">' + esc(l.text) + '</span><br>';
    else if (l.type === 'comment') html += '<span class="comment">' + esc(l.text) + '</span><br>';
    else if (l.type === 'highlight') html += '<span class="highlight">' + esc(l.text) + '</span><br>';
  });
  html += '</div>';
  return html;
}

function fileMock(filename, lines) {
  let html = '<div class="file-mock"><div class="file-mock-bar">&#x1F4C4; ' + esc(filename) + '</div><div class="file-mock-body">';
  lines.forEach(l => {
    if (l.type === 'h1') html += '<div class="line line-h1">' + esc(l.text) + '</div>';
    else if (l.type === 'h2') html += '<div class="line line-h2">' + esc(l.text) + '</div>';
    else if (l.type === 'h3') html += '<div class="line line-h3">' + esc(l.text) + '</div>';
    else if (l.type === 'bold') html += '<div class="line line-bold">' + esc(l.text) + '</div>';
    else if (l.type === 'dim') html += '<div class="line line-dim">' + esc(l.text) + '</div>';
    else if (l.type === 'bullet') html += '<div class="line line-bullet">' + esc(l.text) + '</div>';
    else html += '<div class="line">' + esc(l.text) + '</div>';
  });
  html += '</div></div>';
  return html;
}

function doorayListMock(tasks) {
  let html = '<div class="dooray-mock"><div class="dooray-mock-bar">&#x1F4CB; 내 태스크 목록</div><div class="dooray-mock-body">';
  tasks.forEach(t => {
    html += '<div class="dooray-field"><span class="df-value">' + esc(t.title) + '</span><span class="dooray-tag ' + t.tag + '">' + esc(t.status) + '</span></div>';
  });
  html += '</div></div>';
  return html;
}

function codeBlock(code, lang) {
  const id = 'cb_' + Math.random().toString(36).substring(2,8);
  return '<div class="code-block"><div class="code-block-header"><span>' + (lang||'') + '</span><button class="code-copy" onclick="copyCode(this,\'' + id + '\')">&#x1F4CB; 복사</button></div><pre id="' + id + '">' + esc(code) + '</pre></div>';
}

function successBox(text) {
  return '<div class="result-box success"><span class="result-icon">&#x2705;</span><span>' + text + '</span></div>';
}

function failBox(text) {
  return '<div class="result-box fail"><span class="result-icon">&#x274C;</span><span>' + text + '</span></div>';
}


function tip(text) {
  return ' <span class="tip-trigger" onclick="this.classList.toggle(\'active\');event.stopPropagation()">?<span class="tip-bubble">' + text + '</span></span>';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyCode(btn, id) {
  const pre = document.getElementById(id);
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '&#x2705; 복사됨';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '&#x1F4CB; 복사'; }, 1500);
  }).catch(() => {
    // fallback for older browsers or insecure context
    const ta = document.createElement('textarea');
    ta.value = pre.textContent;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.classList.add('copied');
    btn.innerHTML = '&#x2705; 복사됨';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '&#x1F4CB; 복사'; }, 1500);
  });
}

// SIDEBAR
// ═══════════════════════════════════════════════════════
const SECTIONS = courseMode === 'intro'
  ? ['안내','준비','이론']
  : ['안내','준비','이론','실습','마무리'];
const SECTION_NUMS = {'안내':'0','준비':'1','이론':'2','실습':'3','마무리':'4'};

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '';
  SECTIONS.forEach(sec => {
    const items = STEPS.filter(s => s.section === sec);
    html += '<div class="sb-section">';
    html += '<div class="sb-title" onclick="toggleSection(this)" data-section="' + sec + '">' + SECTION_NUMS[sec] + '. ' + sec + ' <span class="sb-chevron">&#x25BC;</span></div>';
    html += '<div class="sb-items" id="sb-items-' + sec + '">';
    items.forEach(s => {
      html += '<div class="sb-item" data-id="' + s.id + '" onclick="goToStep(\'' + s.id + '\')">';
      html += '<span class="sb-label">' + s.id + '</span>';
      html += '<span class="sb-dot"></span>';
      html += '<span class="sb-text">' + esc(s.title) + '</span>';
      html += '</div>';
    });
    html += '</div></div>';
  });
  sb.innerHTML = html;
}

function toggleSection(el) {
  const sec = el.dataset.section;
  const items = document.getElementById('sb-items-' + sec);
  el.classList.toggle('collapsed');
  items.classList.toggle('collapsed');
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
let currentIndex = 0;

function goToStep(id) {
  const idx = STEPS.findIndex(s => s.id === id);
  if (idx >= 0) goToIndex(idx);
}

function goToIndex(idx) {
  if (idx < 0 || idx >= STEPS.length) return;
  currentIndex = idx;
  const step = STEPS[idx];

  // Update panels
  document.getElementById('previewPanel').innerHTML = step.preview();
  document.getElementById('textPanel').innerHTML = step.content() + buildStepTools(step.id);

  // Update header
  document.getElementById('contentTitle').textContent = step.id + ' \u00B7 ' + step.title;
  document.getElementById('stepCounter').textContent = (idx+1) + ' / ' + STEPS.length;

  // Update bottom nav
  document.getElementById('navLabel').textContent = step.id + ' \u00B7 ' + step.title;
  document.getElementById('navCounter').textContent = (idx+1) + ' / ' + STEPS.length;
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === STEPS.length - 1;

  // Update sidebar active
  document.querySelectorAll('.sb-item').forEach(el => {
    el.classList.remove('active');
    if (el.dataset.id === step.id) el.classList.add('active');
  });

  // Ensure section is expanded
  const sec = step.section;
  const title = document.querySelector('.sb-title[data-section="' + sec + '"]');
  const items = document.getElementById('sb-items-' + sec);
  if (title && title.classList.contains('collapsed')) {
    title.classList.remove('collapsed');
    items.classList.remove('collapsed');
  }

  // Scroll sidebar item into view
  const activeItem = document.querySelector('.sb-item.active');
  if (activeItem) activeItem.scrollIntoView({block:'nearest'});

  // Load saved state
  loadStepState(step.id);

  // Update completed states in sidebar
  updateSidebarCompleted();

  // Scroll text panel to top
  document.getElementById('textPanel').scrollTop = 0;
}

function nextStep() { goToIndex(currentIndex + 1); }
function prevStep() { goToIndex(currentIndex - 1); }

// ═══════════════════════════════════════════════════════
// STEP TOOLS (checkbox + memo)
// ═══════════════════════════════════════════════════════
function buildStepTools(id) {
  return '<div class="step-tools">'
    + '<label class="step-check"><input type="checkbox" onchange="saveStepCheck(\'' + id + '\',this.checked)"><span>완료</span></label>'
    + '<textarea class="step-memo" placeholder="메모..." oninput="saveStepMemo(\'' + id + '\',this.value)"></textarea>'
    + '</div>';
}

function saveStepCheck(id, checked) {
  localStorage.setItem('sc2_' + id + '_check', checked);
  updateSidebarCompleted();
}

function saveStepMemo(id, value) {
  localStorage.setItem('sc2_' + id + '_memo', value);
}

function loadStepState(id) {
  const tools = document.querySelector('.step-tools');
  if (!tools) return;
  const cb = tools.querySelector('input[type="checkbox"]');
  const ta = tools.querySelector('textarea');
  if (cb) cb.checked = localStorage.getItem('sc2_' + id + '_check') === 'true';
  if (ta) ta.value = localStorage.getItem('sc2_' + id + '_memo') || '';
}

function updateSidebarCompleted() {
  document.querySelectorAll('.sb-item').forEach(el => {
    const id = el.dataset.id;
    if (localStorage.getItem('sc2_' + id + '_check') === 'true') {
      el.classList.add('completed');
    } else {
      el.classList.remove('completed');
    }
  });
}

// ═══════════════════════════════════════════════════════
// KEYBOARD NAV
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    nextStep();
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    prevStep();
  }
});

function generateSubmitPrompt() {
  let body = '# 쉐어클래스 실습 기록\n\n';
  SECTIONS.forEach(sec => {
    const items = STEPS.filter(s => s.section === sec);
    let secBody = '';
    items.forEach(s => {
      const checked = localStorage.getItem('sc2_' + s.id + '_check') === 'true';
      const memo = localStorage.getItem('sc2_' + s.id + '_memo') || '';
      if (checked || memo) {
        secBody += '### ' + s.id + ' ' + s.title + (checked ? ' \u2705' : '') + '\n';
        if (memo) secBody += memo + '\n';
        secBody += '\n';
      }
    });
    if (secBody) {
      body += '## ' + SECTION_NUMS[sec] + '. ' + sec + '\n\n' + secBody;
    }
  });

  const prompt = '\uB450\uB808\uC774 \uB0B4 \uAC1C\uC778 \uD504\uB85C\uC81D\uD2B8\uC5D0 \uD0DC\uC2A4\uD06C\uB97C \uC0DD\uC131\uD574\uC918.\n\n'
    + '\uC81C\uBAA9: [\uC258\uC5B4\uD074\uB798\uC2A4] \uC2E4\uC2B5 \uAE30\uB85D\n\n'
    + '\uCC38\uC870\uC790: @\uC815\uC720\uACBD \uD30C\uD2B8\uB108\uC9C0\uC6D0\uD300\n\n'
    + '\uBCF8\uBB38 (\uB9C8\uD06C\uB2E4\uC6B4):\n```\n' + body + '```';

  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9000;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = '<div style="background:#fff;border-radius:16px;padding:24px;max-width:700px;width:90%;max-height:80vh;overflow-y:auto;">'
    + '<h3 style="margin:0 0 12px">&#x1F4EE; 과제 제출 프롬프트</h3>'
    + '<p style="font-size:13px;color:#64748b;margin:0 0 12px">아래 내용을 복사해서 Claude Code에 붙여넣으세요.</p>'
    + '<pre style="background:#0f172a;color:#e2e8f0;padding:16px;border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:50vh;overflow-y:auto;">' + esc(prompt) + '</pre>'
    + '<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">'
    + '<button onclick="this.closest(\'div[style]\').parentElement.remove()" style="padding:8px 20px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;cursor:pointer;">닫기</button>'
    + '<button onclick="navigator.clipboard.writeText(this.dataset.prompt);this.textContent=\'\\u2705 복사됨\'" data-prompt="" style="padding:8px 20px;background:#4f46e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">&#x1F4CB; 복사</button>'
    + '</div></div>';
  modal.querySelector('[data-prompt]').dataset.prompt = prompt;
  modal.addEventListener('click', function(e) { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

<button id="chat-btn" aria-label="익명 채팅 열기" title="익명 채팅">&#x1F4AC;</button>

<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyAHZaTopKHKqA530rPl1dNFsQYmRYN4S4M",
    authDomain: "shareclass-chat.firebaseapp.com",
    projectId: "shareclass-chat",
    storageBucket: "shareclass-chat.firebasestorage.app",
    messagingSenderId: "74045404320",
    appId: "1:74045404320:web:8c36ca34997aad259e45c5",
    measurementId: "G-F28LE8GVND"
  };

  const $btn = document.getElementById("chat-btn");
  const $panel = document.getElementById("chat-panel");
  const $close = document.getElementById("chat-close");
  const $form = document.getElementById("chat-form");
  const $input = document.getElementById("chat-input");
  const $msgs = document.getElementById("chat-msgs");

  $close.addEventListener("click", () => $panel.classList.remove("open"));
  $btn.addEventListener("click", () => $panel.classList.toggle("open"));

  if (firebaseConfig.apiKey === "YOUR_API_KEY") {
    console.warn("[chat] Firebase config 미설정 — 채팅 버튼 숨김");
    $btn.style.display = "none";
  } else {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } =
      await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const msgsRef = collection(db, "chat-messages");

    const palette = ["#7c3aed","#06b6d4","#10b981","#f59e0b","#ef4444","#ec4899","#3b82f6","#8b5cf6"];
    const myColor = palette[Math.floor(Math.random() * palette.length)];

    const escape = s => s.replace(/[<>&"']/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;","'":"&#39;"}[c]));
    const fmtTime = ts => ts?.toDate ? ts.toDate().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}) : "";

    $form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $input.value.trim();
      if (!text) return;
      $input.value = "";
      try {
        await addDoc(msgsRef, { text, color: myColor, createdAt: serverTimestamp() });
      } catch (err) {
        console.error("[chat] send failed:", err);
        alert("전송 실패: " + err.message);
      }
    });

    const q = query(msgsRef, orderBy("createdAt", "desc"), limit(100));
    onSnapshot(q, (snap) => {
      if (snap.empty) {
        $msgs.innerHTML = '<div id="chat-empty">아직 메시지가 없어요. 첫 글 남겨보세요.</div>';
        return;
      }
      const items = [];
      snap.forEach(d => items.push(d.data()));
      items.reverse();
      $msgs.innerHTML = items.map(m =>
        `<div class="chat-msg" style="border-left-color:${m.color || "#ddd"}">${escape(m.text || "")}<div class="chat-msg-time">${fmtTime(m.createdAt)}</div></div>`
      ).join("");
      $msgs.scrollTop = $msgs.scrollHeight;
    }, (err) => {
      console.error("[chat] subscribe failed:", err);
      $msgs.innerHTML = `<div id="chat-empty">채팅을 불러오지 못했어요.<br>(${escape(err.code || "error")})</div>`;
    });
  }
</script>
</body>
</html>
